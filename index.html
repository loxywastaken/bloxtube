<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="BloxTube — a modern video platform with real accounts, glassy iOS design.">
<title>BloxTube</title>
<style>
/* =====================================================================
   BloxTube — glossy glass (iOS) front-end · talks to the Node backend
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg0:#070a14; --bg1:#0d1226; --bg2:#141a33;
  --blob-a:#ff375f; --blob-b:#7c5cff; --blob-c:#0a84ff; --blob-d:#30d0c0;
  --glass:rgba(255,255,255,.07); --glass-2:rgba(255,255,255,.10); --glass-3:rgba(255,255,255,.14);
  --glass-brd:rgba(255,255,255,.14); --glass-brd-2:rgba(255,255,255,.22);
  --gloss:rgba(255,255,255,.28);
  --text:#f2f5ff; --text-dim:#a7b0c8; --text-faint:#6c7590;
  --brand:#ff375f; --brand-2:#ff6b8a; --brand-grad:linear-gradient(135deg,#ff5f6d,#ff375f 60%,#c9268f);
  --accent:#0a84ff; --accent-2:#41a6ff; --accent-grad:linear-gradient(135deg,#41a6ff,#0a84ff);
  --live:#ff453a; --success:#30d158; --warning:#ffd60a; --danger:#ff453a; --plus:#ffd60a;
  --blur:26px; --sat:180%;
  --shadow:0 8px 30px rgba(0,0,0,.34); --shadow-lg:0 20px 60px rgba(0,0,0,.5);
  --inset-gloss:inset 0 1px 0 rgba(255,255,255,.28), inset 0 0 0 .5px rgba(255,255,255,.06);
  --r:20px; --r-sm:13px; --r-lg:28px; --r-pill:999px;
  --topbar-h:60px; --side-w:250px; --side-mini:78px;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Roboto,system-ui,sans-serif;
  --mono:'SF Mono','JetBrains Mono',ui-monospace,Consolas,monospace;
  --ring:0 0 0 3px rgba(10,132,255,.55);
}
:root[data-theme="light"]{
  --bg0:#eaf0ff; --bg1:#dfe7fb; --bg2:#eef2ff;
  --blob-a:#ff8fa8; --blob-b:#b9a8ff; --blob-c:#7cc0ff; --blob-d:#7fe6da;
  --glass:rgba(255,255,255,.55); --glass-2:rgba(255,255,255,.66); --glass-3:rgba(255,255,255,.78);
  --glass-brd:rgba(255,255,255,.75); --glass-brd-2:rgba(255,255,255,.9);
  --gloss:rgba(255,255,255,.9);
  --text:#0b1020; --text-dim:#5a6478; --text-faint:#8a93a8;
  --brand:#ff2d55; --brand-2:#ff5c78; --accent:#007aff; --accent-2:#3395ff;
  --shadow:0 8px 30px rgba(60,80,140,.16); --shadow-lg:0 20px 60px rgba(60,80,140,.22);
  --inset-gloss:inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 .5px rgba(255,255,255,.5);
  --ring:0 0 0 3px rgba(0,122,255,.4);
}
:root[data-contrast="high"]{ --glass-brd:rgba(255,255,255,.5); --text-dim:#c9d2e8; }
html,body{margin:0;height:100%}
body{ background:var(--bg0); color:var(--text); font-family:var(--font); font-size:14.5px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overflow:hidden; position:relative; }
/* animated glass background mesh */
body::before{ content:""; position:fixed; inset:-15%; z-index:-2; background:
  radial-gradient(38% 40% at 15% 18%, color-mix(in srgb, var(--blob-a) 70%, transparent), transparent 60%),
  radial-gradient(42% 44% at 85% 12%, color-mix(in srgb, var(--blob-b) 65%, transparent), transparent 62%),
  radial-gradient(46% 46% at 78% 88%, color-mix(in srgb, var(--blob-c) 62%, transparent), transparent 60%),
  radial-gradient(40% 42% at 12% 85%, color-mix(in srgb, var(--blob-d) 55%, transparent), transparent 60%),
  linear-gradient(160deg,var(--bg1),var(--bg0));
  filter:saturate(1.1); animation:drift 26s ease-in-out infinite alternate; }
body::after{ content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:radial-gradient(120% 90% at 50% -10%, transparent 60%, rgba(0,0,0,.28)); }
@keyframes drift{ 0%{transform:translate3d(0,0,0) scale(1)} 50%{transform:translate3d(2%,-2%,0) scale(1.06)} 100%{transform:translate3d(-2%,2%,0) scale(1.03)} }
:root[data-motion="reduced"] body::before{animation:none}
:root[data-motion="reduced"] *{animation-duration:.001ms!important;transition-duration:.001ms!important}
:root[data-textscale="large"]{font-size:16px}
:root[data-textscale="xl"]{font-size:17.5px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--brand);color:#fff}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:10px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3);background-clip:padding-box}

/* ---------- glass primitives ---------- */
.glass{ background:linear-gradient(var(--glass-2),var(--glass)); backdrop-filter:blur(var(--blur)) saturate(var(--sat)); -webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  border:1px solid var(--glass-brd); box-shadow:var(--shadow),var(--inset-gloss); }
.card{ background:linear-gradient(var(--glass-2),var(--glass)); backdrop-filter:blur(var(--blur)) saturate(var(--sat)); -webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  border:1px solid var(--glass-brd); box-shadow:var(--shadow),var(--inset-gloss); border-radius:var(--r); padding:18px; }

/* ---------- layout ---------- */
#app{height:100%;display:flex;flex-direction:column}
.skip-link{position:absolute;left:8px;top:-60px;z-index:2000;background:var(--brand);color:#fff;padding:10px 16px;border-radius:12px;transition:top .15s}
.skip-link:focus{top:8px}
.topbar{height:var(--topbar-h);display:flex;align-items:center;gap:10px;padding:0 16px;position:relative;z-index:60;flex:0 0 auto;
  background:linear-gradient(var(--glass-2),var(--glass)); backdrop-filter:blur(var(--blur)) saturate(var(--sat)); -webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  border-bottom:1px solid var(--glass-brd); box-shadow:var(--inset-gloss)}
.tb-left,.tb-right{display:flex;align-items:center;gap:6px}
.tb-left{min-width:190px}
.tb-center{flex:1;display:flex;justify-content:center;padding:0 20px}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--text);transition:background .14s,transform .1s;flex:0 0 auto;position:relative}
.icon-btn:hover{background:var(--glass-3)} .icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:22px;height:22px}
.icon-btn .badge{position:absolute;top:2px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--brand);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;line-height:1;box-shadow:0 2px 6px rgba(255,55,95,.5)}
.brand{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:14px;user-select:none}
.brand:hover{background:var(--glass-3)}
.brand .logo{width:32px;height:32px;flex:0 0 auto;filter:drop-shadow(0 3px 8px rgba(255,55,95,.5))}
.brand .wordmark{font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand .wordmark b{background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.search{display:flex;width:100%;max-width:600px;align-items:center;gap:8px}
.search .field{flex:1;display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;border-radius:var(--r-pill);
  background:var(--glass); border:1px solid var(--glass-brd); box-shadow:var(--inset-gloss); transition:border .14s,box-shadow .14s}
.search .field:focus-within{border-color:var(--accent);box-shadow:var(--ring)}
.search .field input{flex:1;background:none;border:0;outline:none;padding:11px 0;color:var(--text)}
.search .field input::placeholder{color:var(--text-faint)}
.search .go{width:44px;height:40px;border-radius:var(--r-pill);display:grid;place-items:center;color:#fff;background:var(--accent-grad);flex:0 0 auto}
.search .mic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--glass-brd);flex:0 0 auto}
.search-suggest{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);width:min(600px,60vw);border-radius:18px;padding:8px;z-index:80;display:none;
  background:linear-gradient(var(--glass-3),var(--glass-2));backdrop-filter:blur(30px) saturate(var(--sat));-webkit-backdrop-filter:blur(30px) saturate(var(--sat));border:1px solid var(--glass-brd);box-shadow:var(--shadow-lg),var(--inset-gloss)}
.search-suggest.open{display:block}
.ss-item{display:flex;align-items:center;gap:12px;padding:9px 14px;cursor:pointer;border-radius:12px}
.ss-item:hover{background:var(--glass-3)}
.ss-item svg{width:17px;height:17px;color:var(--text-dim)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:var(--r-pill);font-weight:600;white-space:nowrap;transition:transform .1s,background .14s,box-shadow .14s;
  background:var(--glass-2);border:1px solid var(--glass-brd);box-shadow:var(--inset-gloss);color:var(--text)}
.btn:hover{background:var(--glass-3)} .btn:active{transform:scale(.96)}
.btn svg{width:18px;height:18px}
.btn.brand{background:var(--brand-grad);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(255,55,95,.4),var(--inset-gloss)}
.btn.accent{background:var(--accent-grad);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(10,132,255,.4),var(--inset-gloss)}
.btn.plus{background:linear-gradient(135deg,#ffe066,#ffd60a);color:#3a2e00;border-color:transparent}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent}
.btn.ghost:hover{background:var(--glass-3)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.icon{padding:9px;width:40px}
.btn.big{padding:13px 22px;font-size:15px}
.btn[disabled]{opacity:.5;pointer-events:none}
.chip{padding:8px 15px;border-radius:var(--r-pill);font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer;transition:background .14s,transform .1s;
  background:var(--glass);border:1px solid var(--glass-brd);box-shadow:var(--inset-gloss);color:var(--text)}
.chip:hover{background:var(--glass-3)} .chip:active{transform:scale(.95)}
.chip.active{background:var(--text);color:var(--bg0);border-color:transparent}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-pill);font-size:11px;font-weight:700;background:var(--glass-3);color:var(--text-dim);border:1px solid var(--glass-brd)}
.pill.live{background:var(--live);color:#fff;border:0}
.pill.new{background:var(--accent);color:#fff;border:0}
.pill.plus{background:var(--plus);color:#3a2e00;border:0}
.pill.sim{background:var(--warning);color:#2a2400;border:0}
.pill.ok{background:var(--success);color:#04220f;border:0}
.pill.role{background:var(--brand);color:#fff;border:0;text-transform:capitalize}

.body-wrap{flex:1;display:flex;min-height:0}
.sidebar{width:var(--side-w);flex:0 0 auto;overflow-y:auto;overflow-x:hidden;padding:10px 10px 40px;transition:width .16s}
.sidebar.mini{width:var(--side-mini)}
.sidebar.hidden{display:none}
.nav-sec{padding:8px 4px;margin-bottom:2px}
.nav-sec+.nav-sec{border-top:1px solid var(--glass-brd)}
.nav-sec h4{margin:8px 10px;font-size:12.5px;color:var(--text-faint);font-weight:700}
.nav-item{display:flex;align-items:center;gap:16px;padding:10px 12px;border-radius:14px;color:var(--text);cursor:pointer;font-size:14.5px;transition:background .12s;position:relative}
.nav-item:hover{background:var(--glass-2)}
.nav-item.active{background:linear-gradient(var(--glass-3),var(--glass-2));border:1px solid var(--glass-brd);box-shadow:var(--inset-gloss);font-weight:600;padding:9px 11px}
.nav-item.active svg{color:var(--brand)}
.nav-item svg{width:23px;height:23px;flex:0 0 auto}
.nav-item .ava{width:26px;height:26px;border-radius:50%;flex:0 0 auto}
.nav-item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .chan-live{width:8px;height:8px;border-radius:50%;background:var(--live)}
.sidebar.mini .nav-sec h4,.sidebar.mini .nav-item .lbl,.sidebar.mini .chan-live{display:none}
.sidebar.mini .nav-item{flex-direction:column;gap:5px;font-size:10px;padding:13px 4px}
.sidebar.mini .nav-mini{display:block;font-size:10px}
.nav-mini{display:none}
.sidebar-foot{padding:14px;font-size:12px;color:var(--text-faint);line-height:1.8}

.main{flex:1;min-width:0;overflow-y:auto;position:relative;scroll-behavior:smooth}
.main-pad{padding:22px 24px 70px;max-width:1720px;margin:0 auto}
.chipbar{position:sticky;top:0;z-index:40;padding:12px 24px;display:flex;gap:10px;overflow-x:auto;
  background:linear-gradient(var(--glass),transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.chipbar::-webkit-scrollbar{display:none}

.grid{display:grid;gap:20px 18px}
.grid.compact{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.grid.comfortable{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.grid.large{grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
.row-section{margin:28px 0}
.row-head{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.row-head h2{font-size:20px;font-weight:800;margin:0;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.row-head .more{margin-left:auto;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer}
.hscroll{display:flex;gap:16px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity}
.hscroll::-webkit-scrollbar{height:8px}
.hscroll>*{scroll-snap-align:start;flex:0 0 auto}
.hscroll.vids>*{width:322px} .hscroll.clips>*{width:184px} .hscroll.compact>*{width:250px}

/* video card */
.vcard{cursor:pointer;position:relative;border-radius:var(--r);transition:transform .16s}
.vcard:hover{transform:translateY(-3px)}
.vcard .thumb{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--glass);border:1px solid var(--glass-brd);box-shadow:var(--shadow)}
.vcard .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.vcard:hover .thumb img{transform:scale(1.05)}
.vcard .dur{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:700;padding:2px 6px;border-radius:7px;backdrop-filter:blur(6px)}
.vcard .live-badge{position:absolute;bottom:8px;left:8px;background:var(--live);color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:7px;display:flex;align-items:center;gap:4px}
.vcard .top-pills{position:absolute;top:8px;left:8px;display:flex;gap:5px}
.vcard .prog{position:absolute;bottom:0;left:0;right:0;height:4px;background:rgba(255,255,255,.3)}
.vcard .prog i{display:block;height:100%;background:var(--brand)}
.vcard .meta{display:flex;gap:12px;margin-top:12px;padding:0 2px}
.vcard .meta .ava{width:38px;height:38px;border-radius:50%;flex:0 0 auto;border:1px solid var(--glass-brd)}
.vcard .info{min-width:0;flex:1}
.vcard .vtitle{font-weight:700;font-size:14.5px;line-height:1.3;max-height:2.6em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vcard .chan{color:var(--text-dim);font-size:13px;margin-top:4px;display:flex;align-items:center;gap:4px}
.vcard .chan:hover{color:var(--text)}
.vcard .stats{color:var(--text-dim);font-size:13px}
.vcard .vmenu{margin-left:auto;color:var(--text-dim);opacity:0;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.vcard:hover .vmenu{opacity:1}.vcard .vmenu:hover{background:var(--glass-3)}
.verified{width:13px;height:13px;color:var(--accent)}

/* clip card */
.clipcard{cursor:pointer;position:relative;border-radius:var(--r);transition:transform .16s}
.clipcard:hover{transform:translateY(-3px)}
.clipcard .thumb{aspect-ratio:9/16;border-radius:var(--r);overflow:hidden;position:relative;background:var(--glass);border:1px solid var(--glass-brd)}
.clipcard .thumb img{width:100%;height:100%;object-fit:cover}
.clipcard .overlay{position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.8));padding:10px;display:flex;flex-direction:column;justify-content:flex-end}
.clipcard .ct{color:#fff;font-weight:700;font-size:13px;max-height:2.6em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.clipcard .cv{color:rgba(255,255,255,.85);font-size:12px;display:flex;align-items:center;gap:4px;margin-top:4px}
.clipcard .cplay{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.5);border-radius:8px;padding:3px 7px;font-size:11px;color:#fff;display:flex;align-items:center;gap:3px;backdrop-filter:blur(6px)}

.empty{padding:70px 20px;text-align:center;color:var(--text-dim)}
.empty .ec{width:96px;height:96px;border-radius:30px;margin:0 auto 18px;display:grid;place-items:center;background:linear-gradient(var(--glass-3),var(--glass));border:1px solid var(--glass-brd);box-shadow:var(--inset-gloss)}
.empty .ec svg{width:44px;height:44px;opacity:.7}
.empty h3{color:var(--text);margin:0 0 8px;font-size:19px}
.divider{height:1px;background:var(--glass-brd);margin:20px 0}
.tag{color:var(--accent);cursor:pointer}.tag:hover{text-decoration:underline}
.skeleton{background:linear-gradient(90deg,var(--glass) 25%,var(--glass-3) 37%,var(--glass) 63%);background-size:400% 100%;animation:sk 1.3s infinite;border-radius:var(--r)}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
.spin{width:44px;height:44px;border:3px solid var(--glass-3);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:60px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* menu */
.menu{position:fixed;z-index:900;border-radius:18px;padding:8px;min-width:230px;max-height:80vh;overflow:auto;
  background:linear-gradient(var(--glass-3),var(--glass-2));backdrop-filter:blur(34px) saturate(var(--sat));-webkit-backdrop-filter:blur(34px) saturate(var(--sat));border:1px solid var(--glass-brd);box-shadow:var(--shadow-lg),var(--inset-gloss)}
.menu-item{display:flex;align-items:center;gap:14px;padding:10px 13px;border-radius:12px;cursor:pointer;font-size:14px;white-space:nowrap}
.menu-item:hover{background:var(--glass-3)}
.menu-item svg{width:19px;height:19px;color:var(--text-dim);flex:0 0 auto}
.menu-item.danger{color:var(--danger)}.menu-item.danger svg{color:var(--danger)}
.menu-item .rt{margin-left:auto;color:var(--text-faint);font-size:12px}
.menu-item.check::after{content:"✓";margin-left:auto;color:var(--accent);font-weight:800}
.menu-item.check.off::after{content:""}
.menu-sep{height:1px;background:var(--glass-brd);margin:6px 6px}
.menu-head{padding:9px 13px;font-size:12px;color:var(--text-faint);font-weight:700}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(4,7,16,.5);z-index:800;display:grid;place-items:center;padding:20px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.modal{width:min(560px,100%);max-height:88vh;overflow:auto;border-radius:var(--r-lg);animation:pop .2s cubic-bezier(.2,.9,.3,1.2);
  background:linear-gradient(var(--glass-3),var(--glass-2));backdrop-filter:blur(40px) saturate(var(--sat));-webkit-backdrop-filter:blur(40px) saturate(var(--sat));border:1px solid var(--glass-brd-2);box-shadow:var(--shadow-lg),var(--inset-gloss)}
.modal.wide{width:min(900px,100%)}.modal.tall{width:min(680px,100%)}
@keyframes pop{from{transform:scale(.94) translateY(10px);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--glass-brd);position:sticky;top:0;z-index:2;backdrop-filter:blur(20px)}
.modal-head h3{margin:0;font-size:19px;flex:1;font-weight:800}
.modal-body{padding:22px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--glass-brd);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;backdrop-filter:blur(20px)}

/* toast */
.toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.toast{padding:13px 20px;border-radius:16px;display:flex;align-items:center;gap:12px;pointer-events:auto;animation:tin .25s ease;max-width:min(90vw,460px);
  background:linear-gradient(var(--glass-3),var(--glass-2));backdrop-filter:blur(30px) saturate(var(--sat));-webkit-backdrop-filter:blur(30px) saturate(var(--sat));border:1px solid var(--glass-brd-2);box-shadow:var(--shadow-lg),var(--inset-gloss);color:var(--text)}

.toast svg{width:20px;height:20px;flex:0 0 auto}

/* forms */

.input,.textarea,.selectbox{width:100%;border-radius:14px;padding:12px 14px;color:var(--text);transition:border .14s,box-shadow .14s;

.textarea{resize:vertical;min-height:90px}
.selectbox{appearance:none;-webkit-appearance:none;background-image:linear-gradient(var(--glass),var(--glass))}

.switch .sl::before{content:"";position:absolute;width:22px;height:22px;left:3px;top:2px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.3)}

.range{-webkit-appearance:none;appearance:none;height:5px;background:var(--glass-3);border-radius:3px;outline:none}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--glass-brd);overflow-x:auto}

.stat-tile{border-radius:var(--r);padding:18px;background:linear-gradient(var(--glass-2),var(--glass));border:1px solid var(--glass-brd);box-shadow:var(--inset-gloss)}

.ambient{position:absolute;inset:-40px;z-index:-1;filter:blur(70px) saturate(1.7);opacity:.55;background-size:cover;background-position:center}

.p-row{display:flex;align-items:center;gap:4px;color:#fff}

.p-toast{position:absolute;top:16px;left:16px;background:rgba(0,0,0,.65);color:#fff;padding:6px 12px;border-radius:10px;z-index:7;font-size:13px;opacity:0;transition:opacity .2s}.p-toast.show{opacity:1}
.side-panel{border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.side-panel .sp-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--glass-brd);font-weight:800}.side-panel .sp-head .x{margin-left:auto}
.side-panel .sp-body{max-height:340px;overflow:auto}
.tr-line{display:flex;gap:12px;padding:8px 14px;cursor:pointer;font-size:13.5px}.tr-line:hover{background:var(--glass-3)}.tr-line.active{background:var(--brand);color:#fff;border-radius:8px;margin:0 6px}

.w-title{font-size:21px;font-weight:800;margin:16px 0 12px;line-height:1.3;letter-spacing:-.01em}

.related-thumb{position:relative;width:168px;flex:0 0 auto}.related-thumb img{width:168px;aspect-ratio:16/9;border-radius:10px;object-fit:cover}
.related-thumb .d{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.8);color:#fff;font-size:11px;padding:1px 5px;border-radius:5px}

/* clips */
.clips-feed{height:calc(100vh - var(--topbar-h));overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.clips-feed::-webkit-scrollbar{display:none}

.clip-surface{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 4s linear}.clip-slide.active .clip-surface{transform:scale(1.08)}
.clip-grad{position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.8));pointer-events:none}

.clip-info .cu{display:flex;align-items:center;gap:10px;margin-bottom:8px}.clip-info .cu img{width:40px;height:40px;border-radius:50%;border:2px solid #fff}.clip-info .cu .h{font-weight:700}
.clip-info .cfollow{background:transparent;border:1.5px solid #fff;color:#fff;padding:5px 14px;border-radius:999px;font-weight:700;font-size:12px}.clip-info .cfollow.on{background:#fff;color:#000}
.clip-cap{font-size:14px;line-height:1.4;margin-bottom:8px;max-width:88%}.clip-cap .tag{color:#7fd0ff}
.clip-rail{display:flex;flex-direction:column;gap:18px;align-items:center;padding-bottom:20px;align-self:flex-end}
.rail-btn{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text)}
.rail-btn .rc{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;transition:transform .1s;background:linear-gradient(var(--glass-2),var(--glass));backdrop-filter:blur(20px);border:1px solid var(--glass-brd);box-shadow:var(--inset-gloss)}
.rail-btn:active .rc{transform:scale(.9)} .rail-btn.on .rc{color:var(--brand)} .rail-btn.on.acc .rc{color:var(--accent)} .rail-btn .rl{font-size:12px;font-weight:700}
.rail-ava img{width:52px;height:52px;border-radius:50%;border:2px solid var(--glass-brd)}
.clips-hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:5;background:rgba(0,0,0,.5);color:#fff;padding:7px 15px;border-radius:999px;font-size:13px;display:flex;gap:8px;align-items:center;backdrop-filter:blur(10px)}
/* upload / studio / admin */
.up-drop{border:2px dashed var(--glass-brd-2);border-radius:24px;padding:56px 20px;text-align:center;background:var(--glass);cursor:pointer;transition:border .15s,background .15s}
.up-drop:hover{border-color:var(--accent);background:var(--glass-2)}.up-drop .uc{width:90px;height:90px;border-radius:28px;margin:0 auto 16px;display:grid;place-items:center;background:linear-gradient(var(--glass-3),var(--glass));border:1px solid var(--glass-brd)}.up-drop .uc svg{width:46px;height:46px;color:var(--text-dim)}
.progress-track{height:9px;background:var(--glass-3);border-radius:6px;overflow:hidden}.progress-track i{display:block;height:100%;background:var(--accent-grad);border-radius:6px;transition:width .3s}
.check-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13.5px}.check-row .dot{width:20px;height:20px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center}.check-row .dot.ok{background:var(--success);color:#fff}.check-row .dot.run{background:var(--warning);color:#2a2400}.check-row .dot.pend{background:var(--glass-3);color:var(--text-dim)}
.workspace{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - var(--topbar-h))}
@media(max-width:900px){.workspace{grid-template-columns:1fr}.ws-nav{display:none}}

.sn-item{display:flex;align-items:center;gap:14px;padding:11px 13px;border-radius:13px;cursor:pointer;font-size:14px;color:var(--text)}
.sn-item:hover{background:var(--glass-2)}.sn-item.active{background:var(--brand-grad);color:#fff;font-weight:600}.sn-item.active svg{color:#fff}.sn-item svg{width:20px;height:20px}
.sn-sep{height:1px;background:var(--glass-brd);margin:8px 6px}
.ws-main{padding:26px 30px 60px;max-width:1440px;overflow-x:hidden}
.ws-head{display:flex;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap}.ws-head .chan-ava{width:58px;height:58px;border-radius:50%;border:1px solid var(--glass-brd)}.ws-head h1{margin:0;font-size:22px}
.bulkbar{display:flex;align-items:center;gap:12px;border-radius:14px;padding:9px 15px;margin-bottom:12px;background:var(--glass-2);border:1px solid var(--glass-brd)}
.chart-wrap svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--text-dim)}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:11px;height:11px;border-radius:3px}

@media(max-width:1100px){.sidebar:not(.force){width:var(--side-mini)}}
@media(max-width:900px){.tb-left{min-width:0}.brand .wordmark{display:none}.search .mic{display:none}.main-pad{padding:16px 14px 60px}}
@media(max-width:640px){.grid.comfortable,.grid.large,.grid.compact{grid-template-columns:1fr}}

function svgUri(svg){return "data:image/svg+xml,"+encodeURIComponent(svg).replace(/%20/g,' ').replace(/%3D/g,'=').replace(/%3A/g,':').replace(/%2F/g,'/').replace(/%22/g,"'");}

  return svgUri(`<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><defs><linearGradient id='a' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${h1} 70% 56%)'/><stop offset='1' stop-color='hsl(${h2} 70% 44%)'/></linearGradient></defs><rect width='120' height='120' fill='url(#a)'/><text x='60' y='63' font-family='sans-serif' font-size='52' font-weight='800' fill='rgba(255,255,255,.96)' text-anchor='middle' dominant-baseline='central'>${mono}</text></svg>`); }
function bannerURI(seed){ const r=mulberry32(seedFrom((seed||"x")+"bn")); const h1=Math.floor(r()*360),h2=(h1+90+Math.floor(r()*120))%360; let sh="";

  return svgUri(`<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='300'><defs><linearGradient id='b' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='hsl(${h1} 65% 32%)'/><stop offset='1' stop-color='hsl(${h2} 68% 22%)'/></linearGradient></defs><rect width='1600' height='300' fill='url(#b)'/>${sh}</svg>`); }

/* ---- media helpers: pick a frame from a video as a poster, read its duration ---- */
function readVideoMeta(file){ return new Promise((resolve)=>{ try{ const url=URL.createObjectURL(file); const vid=document.createElement("video"); vid.preload="metadata"; vid.muted=true; vid.src=url;
  vid.onloadedmetadata=()=>{ const dur=Math.round(vid.duration)||0; const w=vid.videoWidth,h=vid.videoHeight; // seek a little in to grab a representative frame
    const grab=()=>{ try{ const cv=document.createElement("canvas"); const scale=Math.min(1,640/(w||640)); cv.width=Math.max(2,Math.round((w||640)*scale)); cv.height=Math.max(2,Math.round((h||360)*scale)); cv.getContext("2d").drawImage(vid,0,0,cv.width,cv.height); cv.toBlob(b=>{ URL.revokeObjectURL(url); resolve({dur,w,h,poster:b}); },"image/jpeg",0.82); }catch(e){ URL.revokeObjectURL(url); resolve({dur,w,h,poster:null}); } };
    vid.onseeked=grab; try{ vid.currentTime=Math.min(dur>3?1.5:0.1,(dur||1)*0.25); }catch(e){ grab(); } };
  vid.onerror=()=>{ URL.revokeObjectURL(url); resolve({dur:0,w:0,h:0,poster:null}); };
 }catch(e){ resolve({dur:0,w:0,h:0,poster:null}); } }); }

function renderAuth(){

  if(first)mode="signup";

  const card=el("div",{class:"auth-card"});
  const draw=()=>{ card.innerHTML=`
    <div class="brand-big">${LOGO}<span class="wordmark"><b>Blox</b>Tube</span></div>
    <p class="auth-sub">${first?"Welcome! Create the first account — you'll be the owner.":"Sign in or create an account to continue."}</p>
    <div class="auth-toggle"><button data-m="login" class="${mode==="login"?"active":""}">Sign in</button><button data-m="signup" class="${mode==="signup"?"active":""}">Create account</button></div>
    <div class="auth-err" id="auth-err" hidden></div>
    <form id="auth-form">

      <div class="field-group"><label>${mode==="signup"?"Handle":"Handle or email"}</label><input class="input" id="a-id" placeholder="${mode==="signup"?"yourhandle":"handle or email"}" autocomplete="username"></div>
      ${mode==="signup"?`<div class="field-group"><label>Email</label><input class="input" id="a-email" type="email" placeholder="you@example.com" autocomplete="email"></div>`:""}
      <div class="field-group"><label>Password</label><input class="input" id="a-pw" type="password" placeholder="${mode==="signup"?"At least 6 characters":"Your password"}" autocomplete="${mode==="signup"?"new-password":"current-password"}"></div>
      <button class="btn brand big" type="submit" style="width:100%" id="a-submit">${mode==="signup"?"Create account":"Sign in"}</button>
    </form>
    <div class="auth-foot">Real accounts, stored on the BloxTube server. Passwords are hashed — never stored in plain text.</div>`;
    card.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw();});
    const form=card.querySelector("#auth-form"), err=card.querySelector("#auth-err"), submit=card.querySelector("#a-submit");
    form.onsubmit=async e=>{ e.preventDefault(); err.hidden=true; submit.disabled=true; submit.textContent="Please wait…";
      try{ if(mode==="signup"){ await Auth.signup({ handle:card.querySelector("#a-id").value.trim(), email:card.querySelector("#a-email").value.trim(), password:card.querySelector("#a-pw").value, displayName:card.querySelector("#a-name").value.trim() }); toast("Welcome to BloxTube 🎉",{type:"ok"}); }

    };
  };
  draw(); wrap.append(card); root.append(wrap);
}

function railBtn(ic,label,cls=""){ const b=el("button",{class:"rail-btn "+cls}); b.innerHTML=`<span class="rc">${icon(ic,24)}</span><span class="rl">${label}</span>`; return b; }
function buildClipFeed(clips,startIndex){ const feed=el("div",{class:"clips-feed",tabindex:"0"}); clips.forEach(c=>feed.append(clipSlide(c)));
  let activeSlide=null,pos=0,paused=false;
  const setActive=s=>{if(activeSlide===s)return;
    if(activeSlide){activeSlide.classList.remove("active","paused");const ov=activeSlide.querySelector(".clip-vid");if(ov){try{ov.pause();}catch(e){}}}
    activeSlide=s;if(s){s.classList.add("active");pos=0;paused=false;API.post("/api/videos/"+s.dataset.id+"/view").catch(()=>{});
      const nv=s.querySelector(".clip-vid");if(nv){if(!nv.getAttribute("src")&&nv.dataset.src)nv.src=nv.dataset.src;try{nv.currentTime=0;}catch(e){}const pr=nv.play();if(pr&&pr.catch)pr.catch(()=>{});}}};
  feed._toggle=()=>{paused=!paused;if(activeSlide){activeSlide.classList.toggle("paused",paused);const v=activeSlide.querySelector(".clip-vid");if(v){if(paused)v.pause();else{v.muted=false;v.play().catch(()=>{v.muted=true;v.play().catch(()=>{});});}}}};
  feed._seek=p=>{if(activeSlide){const v=activeSlide.querySelector(".clip-vid");if(v&&v.duration){try{v.currentTime=p*v.duration;}catch(e){}}else pos=p*(+activeSlide.dataset.dur);}};
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>=.6)setActive(e.target);}),{root:feed,threshold:[.6]}); [...feed.children].forEach(s=>io.observe(s));
  const tick=setInterval(()=>{if(!document.body.contains(feed)){clearInterval(tick);io.disconnect();return;}if(!activeSlide||paused)return;
    const v=activeSlide.querySelector(".clip-vid");let frac;
    if(v&&v.duration){frac=v.currentTime/v.duration;}else{const dur=+activeSlide.dataset.dur||20;pos+=.1;if(pos>=dur)pos=0;frac=pos/dur;}
    const bar=activeSlide.querySelector(".clip-prog i");if(bar)bar.style.width=(frac||0)*100+"%";},100);
  feed.addEventListener("keydown",e=>{if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();const idx=[...feed.children].indexOf(activeSlide);const n=clamp(idx+(e.key==="ArrowDown"?1:-1),0,feed.children.length-1);feed.children[n].scrollIntoView({behavior:"smooth"});}if(e.key===" "){e.preventDefault();feed._toggle();}});
  setTimeout(()=>{const s=feed.children[startIndex||0];if(s){s.scrollIntoView();setActive(s);}feed.focus();},30);

  return feed; }

function chartBars(items,{h=200,pad=30}={}){ const w=680,max=Math.max(1,...items.map(i=>i.value)),iw=w-pad*2,ih=h-pad*1.5,bw=iw/Math.max(items.length,1)*0.62;
  const bars=items.map((it,i)=>{const x=pad+(i+0.5)*(iw/items.length)-bw/2,bh=it.value/max*ih,y=pad*0.4+ih-bh;return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="5" fill="url(#bg)"><title>${esc(it.label)}: ${fmtN(it.value)}</title></rect><text x="${x+bw/2}" y="${h-6}" text-anchor="middle" font-size="10" fill="var(--text-faint)">${esc(it.label.length>9?it.label.slice(0,8)+"…":it.label)}</text>`;}).join("");
  return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b8a"/><stop offset="1" stop-color="#0a84ff"/></linearGradient></defs>${bars||'<text x="340" y="100" text-anchor="middle" fill="var(--text-faint)">No data yet</text>'}</svg></div>`; }
